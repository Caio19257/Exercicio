<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        form {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
            background-color: gray;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(35, 0, 133, 0.6);
        }
        fieldset {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid #ffffff;
            border-radius: 10px;
            background-color: #fafcff;
        }

        legend {
            padding: 6px 12px;

        }
    </style>
</head>
<body>
    <form action="#" method="post">
        <h1>Cadastro para contato</h1>
        <label for="nome">Nome Completo:<label>
        <input type="text" name="nome" id="nome" placeholder="Digite seu nome completo" required>
        <label for="genêro">Genêro</label>
        <select name="genêro" id="genêro" required>
            <option value="Feminino">Feminino</option>
            <option value="Masculino">Masculino</option>
            <option value="Outro">Outro</option>
        </select>

        <label for="telefone">telefone:</label>
        <input type="tel" name="telefone" id="telefone" placeholder="(00) 00000-0000" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="exemplo@gmail.com" required>
        
        <label for="endereço">Endereço</label>
        <input type="endereço" id="endereço" name="endereço" placeholder="rua exemplo (000)" required>

        <a href="2 index.html"><button type="button">Enviar</button></a>
        <button type="reset">Limpar</button> 
    </form>
</body>
</html>
